services:
  db:
    image: postgres:18-alpine
    container_name: kursu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kursu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-kursu_db}
    # Host'tan DBeaver/pgAdmin ile bağlanabilmek için açık.
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ imajında PGDATA alt dizine taşındı; mount üst dizine yapılır.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kursu} -d ${POSTGRES_DB:-kursu_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kursu_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Uygulama ayarlarının tek kaynağı; kök .env yalnızca postgres/port değişkenlerini taşır.
    env_file:
      - ./backend/.env
    # env_file'ı ezer: konteyner içinde host localhost değil db servisidir.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kursu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kursu_db}
    ports:
      - "${API_PORT:-8000}:8000"
    # Geliştirme aşamasında kodu kaydettiğinde Docker'ı yeniden başlatmadan anında yansıması için:
    volumes:
      - ./backend:/app

volumes:
  pgdata: